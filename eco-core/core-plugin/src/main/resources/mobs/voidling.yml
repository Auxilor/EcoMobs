# A base mob and modifiers
mob: skeleton attack-damage:5 movement-speed:1 follow-range:24 health:30

# The ID of the mob category, handles spawning.
category: common

# Supported placeholders:
# %health%, %max_health%, %health_percent%, %time% (formats as minutes:seconds, eg 1:56)
display-name: "&5Voidling &7| &c%health%♥"

# If the mob you're using supports equipment, you can specify the items in each slot.
equipment: { }

# Options for plugin integrations
integrations:
  levelled-mobs:
    can-level: true
  model-engine:
    id: ""
  better-model:
    id: ""
  libs-disguises:
    id: ""

# Custom Mob AI
# Adds blink-around movement on top of its normal vanilla behaviour.
custom-ai:
  clear: false
  target-goals: [ ]
  entity-goals:
    - key: ecomobs:random_teleport
      priority: 0
      args:
        interval: 60
        range: 6

# Some effects are ran from the perspective of the entity, and others from the perspective
# of the player - each section is marked with which perspective it is run from.
effects:
  permanent-effects: [ ]

  spawn:
    - id: set_glowing
      args:
        glowing: true

  despawn: [ ]
  interact: [ ]
  melee-attack: [ ]
  ranged-attack: [ ]
  any-attack: [ ]
  take-damage: [ ]

  damage-player:
    - id: send_message
      args:
        message: "&5The void whispers your name..."

  kill-player: [ ]
  death: [ ]
  kill: [ ]

# The lifespan of the mob, in seconds. Set to -1 to disable.
lifespan: 100

defence:
  can-mount: true
  damage-modifiers:
    hot_floor: 1
    fire_tick: 1
    lava: 1
    suffocation: 1
    drowning: 1
    entity_explosion: 1
    block_explosion: 1

# Options for what the mob drops
drops:
  experience: 10
  items:
    - chance: 100
      items:
        - bone
    - chance: 25
      items:
        - ender_pearl

# Options for the boss bar
boss-bar:
  enabled: false
  color: white
  style: progress
  radius: 120

# Options for spawning the mob
spawn:
  totem:
    enabled: false
    top: netherite_block
    middle: iron_block
    bottom: magma_block
    conditions: [ ]

  egg:
    enabled: true
    conditions: [ ]
    item: skeleton_spawn_egg
    name: "&5Voidling&f Spawn Egg"
    lore:
      - ""
      - "&8&oPlace on the ground to"
      - "&8&osummon a &5Voidling"
    craftable: false
    shapeless: false
    recipe: [ ]
