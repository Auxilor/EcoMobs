# A base mob and modifiers
mob: drowned attack-damage:6 movement-speed:1 health:28

# The ID of the mob category, handles spawning.
category: common

# Supported placeholders:
# %health%, %max_health%, %health_percent%, %time% (formats as minutes:seconds, eg 1:56)
display-name: "&bTide Lurker &7| &c%health%♥"

# If the mob you're using supports equipment, you can specify the items in each slot.
equipment:
  hand: trident

# Options for plugin integrations
integrations:
  levelled-mobs:
    can-level: true
  model-engine:
    id: ""
  better-model:
    id: ""
  libs-disguises:
    id: ""

# Custom Mob AI
custom-ai:
  clear: false
  target-goals: [ ]
  entity-goals: [ ]

# Some effects are ran from the perspective of the entity, and others from the perspective
# of the player - each section is marked with which perspective it is run from.
effects:
  permanent-effects: [ ]
  spawn: [ ]
  despawn: [ ]
  interact: [ ]

  melee-attack:
    - id: pull_in
      args:
        velocity: 1.2

  ranged-attack: [ ]
  any-attack: [ ]
  take-damage: [ ]
  damage-player: [ ]
  kill-player: [ ]
  death: [ ]
  kill: [ ]

# The lifespan of the mob, in seconds. Set to -1 to disable.
lifespan: 100

defence:
  can-mount: true
  damage-modifiers:
    hot_floor: 1
    fire_tick: 1
    lava: 1
    suffocation: 1
    drowning: 0
    entity_explosion: 1
    block_explosion: 1

# Options for what the mob drops
drops:
  experience: 10
  items:
    - chance: 100
      items:
        - prismarine_shard
    - chance: 10
      items:
        - nautilus_shell

# Options for the boss bar
boss-bar:
  enabled: false
  color: white
  style: progress
  radius: 120

# Options for spawning the mob
spawn:
  totem:
    enabled: false
    top: netherite_block
    middle: iron_block
    bottom: magma_block
    conditions: [ ]

  egg:
    enabled: true
    conditions: [ ]
    item: drowned_spawn_egg
    name: "&bTide Lurker&f Spawn Egg"
    lore:
      - ""
      - "&8&oPlace on the ground to"
      - "&8&osummon a &bTide Lurker"
    craftable: false
    shapeless: false
    recipe: [ ]
